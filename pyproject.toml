[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting"
version = "0.1.0"
description = "In-house transcription MCP server (wraps the local trans stack)"
readme = "CLAUDE.md"
requires-python = ">=3.11"
authors = [{ name = "Joshua Brown" }]
license = { text = "Proprietary" }
dependencies = [
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
meeting = "meeting.cli:main"

[tool.setuptools.packages.find]
include = ["meeting*"]
exclude = ["tests*"]
